```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>Login</h2>

    <!-- Error message -->
    <p class="error" th:if="${emsg}" th:text="${emsg}"></p>

    <!-- Login Form -->
    <form th:action="@{/login}" th:object="${user}" method="post">

        <label>Email:</label>
        <input type="email"
               th:field="*{email}"
               placeholder="Enter Email"
               required>

        <label>Password:</label>
        <input type="password"
               th:field="*{pwd}"
               placeholder="Enter Password"
               required>

        <button type="submit">Login</button>

    </form>

    <p style="text-align:center;">
        <a th:href="@{/register}">Create New Account</a>
    </p>

</div>

</body>
</html>
```
