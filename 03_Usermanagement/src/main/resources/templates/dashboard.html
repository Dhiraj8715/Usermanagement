```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Navigation Bar */
        .navbar {
            background-color: #1f3c88;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .logout-btn {
            background-color: #e74c3c;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        /* Main Dashboard */
        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .welcome-box h1 {
            color: #1f3c88;
            margin-bottom: 12px;
        }

        .welcome-box p {
            color: #666;
            font-size: 16px;
        }

        /* Quote Section */
        .quote-box {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .quote-box h2 {
            color: #1f3c88;
            margin-bottom: 25px;
        }

        .quote {
            font-size: 21px;
            font-style: italic;
            line-height: 1.7;
            color: #444;
            margin-bottom: 20px;
        }

        .author {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 25px;
        }

        .quote-btn {
            display: inline-block;
            background-color: #1f3c88;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 5px;
        }

        .quote-btn:hover {
            background-color: #162d65;
        }

        .error-message {
            color: #c0392b;
            margin-top: 15px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .navbar {
                padding: 15px;
            }

            .navbar h2 {
                font-size: 18px;
            }

            .container {
                margin: 25px auto;
                padding: 15px;
            }

            .welcome-box,
            .quote-box {
                padding: 22px;
            }

            .quote {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h2>User Dashboard</h2>
        <a th:href="@{/logout}" class="logout-btn">Logout</a>
    </nav>

    <!-- Dashboard Content -->
    <div class="container">

        <!-- Welcome Section -->
        <div class="welcome-box">
            <h1>Welcome to Your Dashboard!</h1>
            <p>You have successfully logged in.</p>
        </div>

        <!-- Quote Section -->
        <div class="quote-box">

            <h2>Quote of the Day</h2>

            <div th:if="${dashBoardInfo != null}">
                <p class="quote"
                   th:text="${dashBoardInfo.quote}">
                    Your inspirational quote will appear here.
                </p>

                <p class="author">
                    - <span th:text="${dashBoardInfo.author}">Author</span>
                </p>

                <a th:href="@{/quote}" class="quote-btn">
                    Get Another Quote
                </a>
            </div>

            <div th:if="${dashBoardInfo == null}">
                <p class="error-message">
                    Unable to load the quote. Please try again.
                </p>

                <a th:href="@{/quote}" class="quote-btn">
                    Try Again
                </a>
            </div>

        </div>

    </div>

</body>
</html>
